schema_version: "1.0"
purpose: host-neutral provenance adapter contract; adapters observe, they do not invent execution events
platforms:
  codex:
    event_source: native-session-tool-events
    required_fields: [session_id, run_id, worktree_identity, observed_events, observation_sha256]
    signer: watchmen-admin
  antigravity:
    event_source: host-session-receipt
    required_fields: [session_id, run_id, worktree_identity, observed_events, observation_sha256]
    signer: watchmen-admin
  generic-ide:
    event_source: user-supplied-adapter
    required_fields: [session_id, run_id, worktree_identity, observed_events, observation_sha256]
    signer: watchmen-admin
rules:
  - adapters_must_fail_closed_when_event_source_is_unavailable
  - signer_must_not_construct_observed_events
  - filename_or_prompt_claim_is_not_provenance
  - credentials_and_raw_model_transcripts_are_never_persisted
