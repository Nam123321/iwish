<h1>Integration Guide: offline-predictive-router</h1>
<h2>Use Cases</h2>
<ul>
  <li>Early triage of user requests to determine computational requirements.</li>
  <li>Preventing excessive token usage on trivial operations.</li>
</ul>
<h2>Constraints</h2>
<ul>
  <li>Not intended for semantic validation.</li>
  <li>Does not understand nuances; purely heuristic.</li>
</ul>
